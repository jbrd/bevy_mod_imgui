name: Rust

on:
  push:
    branches: [ "main", "0.6.0" ]
  pull_request:
    branches: [ "main", "0.6.0" ]
  merge_group:
    types: [checks_requested]

env:
  CARGO_TERM_COLOR: always

jobs:
  build:

    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        backend:
          - name: imgui
            build_flags: "--all-targets --features docking"
            test_flags: "--all-targets --features docking"
            clippy_flags: "--workspace --all-targets --features docking"
            doc_flags: "--features docking"
          - name: dear
            build_flags: "--no-default-features --features dear-imgui-rs"
            test_flags: "--no-default-features --features dear-imgui-rs"
            clippy_flags: "--workspace --no-default-features --features dear-imgui-rs"
            doc_flags: "--no-default-features --features dear-imgui-rs"

    steps:
    - uses: actions/checkout@v3
    - uses: dtolnay/rust-toolchain@stable
      with:
        components: rustfmt, clippy
    - name: Backend
      run: echo "Backend=${{ matrix.backend.name }}"
    - name: Build
      run: cargo build --verbose ${{ matrix.backend.build_flags }}
    - name: Build examples (dear)
      if: matrix.backend.name == 'dear'
      run: cargo build --verbose --example dear-minimal --no-default-features --features dear-imgui-rs
    - name: Run tests
      run: cargo test --verbose ${{ matrix.backend.test_flags }}
    - name: Run format checks
      run: cargo fmt --all -- --check
    - name: Run clippy
      run: cargo clippy ${{ matrix.backend.clippy_flags }} -- -Dwarnings --no-deps
    - name: Run doc
      run: cargo doc --no-deps ${{ matrix.backend.doc_flags }}
